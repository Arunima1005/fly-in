[project]
name = "fly-in"
version = "0.1.0"
description = "Fly-in drone simulation"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
    "flake8",
    "mypy",
]

[tool.mypy]
python_version = "3.10"
strict = true

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"